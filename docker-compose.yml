services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: landguard
      POSTGRES_USER: landguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landguard -d landguard"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - landguard_pgdata:/var/lib/postgresql/data
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg://landguard:${POSTGRES_PASSWORD}@db:5432/landguard
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LANDGUARD_PROOF_SECRET: "${LANDGUARD_PROOF_SECRET}"

      LANDGUARD_REGISTRY_V2_ADDRESS: ${LANDGUARD_REGISTRY_V2_ADDRESS}

      LANDGUARD_BACKEND_PRIVATE_KEY: ${LANDGUARD_BACKEND_PRIVATE_KEY}


      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DEMO_MODE: "true"
      DEMO_APPLICANT_PASSWORD: ${DEMO_APPLICANT_PASSWORD:?Set DEMO_APPLICANT_PASSWORD}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Set DEMO_ADMIN_PASSWORD}
      DEMO_AUDITOR_PASSWORD: ${DEMO_AUDITOR_PASSWORD:?Set DEMO_AUDITOR_PASSWORD}
    networks: [internal]


  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.blockchain_worker
    depends_on:
      db:
        condition: service_healthy
    environment: *backend_environment
    networks: [internal]


  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:8080:80"
    networks: [internal]

volumes:
  landguard_pgdata:

networks:
  internal:
